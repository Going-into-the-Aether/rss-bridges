name: Update Christadelphian snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: christadelphian-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Fetch and validate publisher snapshot
        run: npm run snapshot:christadelphian -- --output="$RUNNER_TEMP/the-christadelphian-posts.json"
      - name: Publish snapshot to data branch
        env:
          SNAPSHOT_PATH: ${{ runner.temp }}/the-christadelphian-posts.json
        run: |
          git fetch origin data:data
          git worktree add "$RUNNER_TEMP/rss-bridges-data" data
          cp "$SNAPSHOT_PATH" "$RUNNER_TEMP/rss-bridges-data/the-christadelphian-posts.json"
          cd "$RUNNER_TEMP/rss-bridges-data"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-christadelphian-posts.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh Christadelphian snapshot"
          git push origin HEAD:data
